workflows:
  ios-unsigned:
    name: iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: rpmont-conferencia-app

    environment:
      xcode: latest
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Lint
        script: |
          npm run lint

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS simulator app
        working_directory: rpmont-conferencia-app/ios/App
        script: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - /tmp/xcodebuild_logs/*.log
spring.application.name=conferencia-api

server.address=0.0.0.0
server.port=8080


# Timeouts do transporte de e-mail em milissegundos (SMTP e SMTPS).
spring.mail.properties[mail.smtp.connectiontimeout]=${RPMONT_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtp.timeout]=${RPMONT_SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtp.writetimeout]=${RPMONT_SMTP_WRITE_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtps.connectiontimeout]=${RPMONT_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtps.timeout]=${RPMONT_SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtps.writetimeout]=${RPMONT_SMTP_WRITE_TIMEOUT_MS:5000}

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MySQL exclusivo de homologacao - Docker
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/rpmont_homologacao
spring.datasource.username=rpmont_teste
spring.datasource.password=${RPMONT_HOMOLOG_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validar estrutura sem criar ou alterar tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT exclusivo da homologacao
jwt.secret=${RPMONT_HOMOLOG_JWT_SECRET}
jwt.expiration=3600000

# Nao iniciar servidor HTTP nos testes
spring.main.web-application-type=none